<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itda</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #f6f4ff 0%, #fdf2f8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 48px 32px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #f472b6);
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: white;
    font-weight: 700;
  }
  h1 {
    font-size: 22px;
    color: #1f2937;
    margin-bottom: 8px;
  }
  p.tagline {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .badge {
    display: inline-block;
    background: #f3f4ff;
    color: #7c3aed;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 24px;
    font-weight: 600;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .links a {
    display: block;
    text-decoration: none;
    background: #f9fafb;
    color: #374151;
    padding: 14px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid #eee;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .links a:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
  }
  footer {
    margin-top: 28px;
    font-size: 11px;
    color: #b0b3bb;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">it</div>
    <h1>itda</h1>
    <p class="tagline">한 줄 소개 문구가 여기 들어갑니다.</p>
    <span class="badge">Coming Soon</span>
    <div class="links">
      <a href="#">인스타그램 바로가기</a>
      <a href="#">카카오톡 문의</a>
      <a href="#">서비스 소개 보기</a>
    </div>
    <footer>© 2026 itda. All rights reserved.</footer>
  </div>
</body>
</html>
